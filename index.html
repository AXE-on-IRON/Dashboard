<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centurion Command Center</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #121212;
            border: 1px solid #2a2a2a;
            padding: 40px;
            border-radius: 4px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 {
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
            color: #ffffff;
        }
        .subtitle {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 10px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: #aaa;
        }
        input {
            width: 100%;
            background-color: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            box-sizing: border-box;
            font-size: 16px;
            border-radius: 4px;
        }
        input:focus {
            outline: none;
            border-color: #888;
        }
        button {
            width: 100%;
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 4px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #cccccc;
        }
        .result-box {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed #333;
            display: none;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 15px;
        }
        .result-value {
            color: #ffffff;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Command Center</h2>
    <div class="subtitle">Asset Projection Engine</div>
    
    <div class="input-group">
        <label for="assets">Liquidity Base ($)</label>
        <input type="number" id="assets" placeholder="e.g. 100000">
    </div>
    
    <div class="input-group">
        <label for="growth">Target Annual Growth (%)</label>
        <input type="number" id="growth" placeholder="e.g. 8" step="0.1">
    </div>
    
    <button onclick="calculateProjection()">Execute Analysis</button>
    
    <div class="result-box" id="results">
        <div class="result-item">
            <span>Initial Principal:</span>
            <span class="result-value" id="res-principal">$0.00</span>
        </div>
        <div class="result-item">
            <span>1-Year Forecast:</span>
            <span class="result-value" id="res-year1">$0.00</span>
        </div>
        <div class="result-item">
            <span>5-Year Forecast:</span>
            <span class="result-value" id="res-year5">$0.00</span>
        </div>
    </div>
</div>

<script>
    function calculateProjection() {
        const principal = parseFloat(document.getElementById('assets').value);
        const growthInput = parseFloat(document.getElementById('growth').value);
        
        if (isNaN(principal) || isNaN(growthInput)) {
            alert('Please enter valid numerical parameters.');
            return;
        }
        
        const rate = growthInput / 100;
        const year1 = principal * Math.pow((1 + rate), 1);
        const year5 = principal * Math.pow((1 + rate), 5);
        
        document.getElementById('res-principal').innerText = '$' + principal.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('res-year1').innerText = '$' + year1.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('res-year5').innerText = '$' + year5.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        
        document.getElementById('results').style.display = 'block';
    }
</script>

</body>
</html>
